[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wordlist-kit"
version = "1.0.0"
description = "Wordlist Kit — an all-in-one wordlist toolkit (crunch + CeWL + CUPP + rule templates) with recon, OSINT and attack-command assembly. For authorised security testing only."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Kanishk Dadhich", email = "kanishkdadhich123@gmail.com" }]
keywords = [
    "wordlist", "password", "security", "pentest", "cupp", "cewl",
    "osint", "bruteforce", "hydra", "gobuster", "ffuf", "red-team",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Utilities",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/kanishk-dadhich/wlkit"
Repository = "https://github.com/kanishk-dadhich/wlkit"
Issues = "https://github.com/kanishk-dadhich/wlkit/issues"
"Tip the author" = "https://razorpay.me/@kanishkdadhich"

[project.scripts]
wlkit = "wlkit:main"

[tool.setuptools]
py-modules = ["wlkit"]
