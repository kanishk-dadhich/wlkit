name: Publish to PyPI

# Publishes wlkit to PyPI via Trusted Publishing (OIDC) when a GitHub Release
# is published. No API token needed — PyPI trusts this repo+workflow+environment.

on:
  release:
    types: [published]
  workflow_dispatch:        # lets you run it manually from the Actions tab

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi        # must match the "Environment name" on PyPI
    permissions:
      id-token: write        # required for Trusted Publishing (OIDC)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Build sdist and wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
